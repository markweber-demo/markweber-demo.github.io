<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Проверка аппарата по номеру — Бугульминский механический завод</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/css/proverka.css">
</head>
<body class="pr-body">
<div id="page" data-screen="Проверка аппарата">
  <header class="pr-top">
    <div class="container pr-top__in">
      <a href="index.html" class="pr-top__home"><img class="pr-top__logo" src="assets/img/logo-bmz-70-siniy.svg" alt="Бугульминский механический завод, 70 лет" width="152" height="44"></a>
      <span class="pr-top__name">Проверка аппарата</span>
      <a class="pr-top__link" href="index.html">Войти в сервис</a>
    </div>
  </header>

  <main class="container pr">
    <section class="pr-hero">
      <h1 class="pr-title">Проверка аппарата по заводскому номеру</h1>
      <p class="pr-lead">По номеру с таблички любой может проверить, изготовлен ли аппарат на БМЗ и действует ли гарантия, скачать руководство по эксплуатации и подать заявку на ремонт. Вход не нужен.</p>
      <form class="pr-form" id="pr-form" autocomplete="off" novalidate>
        <label class="field pr-form__field"><span class="field__label label">Заводской номер</span>
          <input class="input pr-form__input" id="pr-n" name="n" inputmode="numeric" placeholder="Например, 40718" maxlength="20"></label>
        <button class="btn btn--primary btn--lg" type="submit" data-act="pr-check">Проверить</button>
      </form>
    </section>

    <div id="pr-out" aria-live="polite"></div>

    <p class="pr-foot">Прототип. Данные демонстрационные</p>
  </main>
</div>

<script src="assets/mock.js"></script>
<script src="assets/store.js"></script>
<script src="assets/dannye.js"></script>
<script src="assets/render.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/tur.js"></script>
<script src="assets/page-proverka.js"></script>
</body>
</html>
